---
- name: Deploy AAP Infrastructure Configuration
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/main.yml
    - vars/vault.yml
    - common/vars/credentials.yml
    - common/vars/projects.yml
    - use_case_1/vars/main.yml
  tasks:
    - name: Apply common AAP configuration
      ansible.builtin.include_tasks:
        file: common/dispatch.yml
      tags:
        - common

    - name: Apply use case 1 AAP configuration
      ansible.builtin.include_tasks:
        file: use_case_1/dispatch.yml
      tags:
        - use_case_1
