---
catalyst_user: example_user
# This is a demonstration of best practice for storing sensitive information in a vault file.
catalyst_password: "{{ vault_catalyst_password }}"
catalyst_host: "catalyst.example.com"
catalyst_version: "2.3.7.9"

# This is a custom credential type for Cisco Catalyst Center. Other REST API credentials can follow a similar pattern
controller_credential_type:
  - name: "Cisco Catalyst Center"
    description: "Custom credential type for Cisco Catalyst Center"
    inputs:
      fields:
        - id: catalyst_host
          type: string
          label: Catalyst Center Host / IP
          help_text: IP address or FQDN of the Cisco Catalyst Center appliance
        - id: catalyst_username
          type: string
          label: Username
          help_text: Leave blank if using an API / Encoded Auth Token
        - id: catalyst_password
          type: string
          label: Password
          secret: true
          help_text: Leave blank if using an API / Encoded Auth Token
        - id: catalyst_encoded_auth
          type: string
          label: API / Encoded Auth Token
          secret: true
          help_text: Base64-encoded string or token (leave blank if using Username/Password)
        - id: catalyst_port
          type: string
          label: HTTPS Port
          default: '443'
        - id: catalyst_version
          type: string
          label: Catalyst Center Version
          default: '2.3.7.9'
        - id: catalyst_verify
          type: boolean
          label: Verify SSL Certificates
          default: false
      required:
        - catalyst_host

controller_credentials:
  - name: "Configuration SCM Credential"
    description: "Credential for Configuration Project SCM"
    credential_type: "Source Control"
    inputs:
      username: "{{ scm_username }}"
      password: "{{ scm_password }}"
  - name: "Example Credential"
    description: "Example Credential for Ansible Automation Platform"
    credential_type: "Machine"
    inputs:
      username: "example_user"
      password: "{{ vault_example_machine_password }}"
  - name: "Cisco Catalyst Center Credential"
    description: "Credential for Cisco Catalyst Center"
    credential_type: "Cisco Catalyst Center"
    inputs:
      catalyst_host: "{{ catalyst_host }}"
      catalyst_username: "{{ catalyst_user }}"
      catalyst_password: "{{ catalyst_password }}"
      catalyst_port: "443"
      catalyst_version: "{{ catalyst_version }}"
      catalyst_verify: false
